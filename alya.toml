[package]
name = "ipc"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Cross-platform inter-process communication: TCP loopback, named pipes, Unix sockets, framing and request-reply for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/ipc"
keywords = ["alya", "alya-lang", "package", "ipc", "networking", "c", "ffi"]

[dependencies]

[build]
c-sources = ["c/ipc.c"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
links = "ipc"

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`
# and `src/types.alya`). `default` is active unless the caller passes
# `--no-default-features`; select features explicitly via
# `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["tcp", "pipe", "framing"]
tcp = []
pipe = []
framing = []

